name: Publish statistics website
on:
  workflow_dispatch:
    inputs:
      bootstrap:
        description: 'Use the bounded initialization budget'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'stat/**'
      - '!stat/docs/**'
      - '!stat/README.md'
      - 'AK_Exusiai/images/**'
      - 'AK_Exusiai/localization/**'
      - 'AK_ExusiaiCode/Cards/**'
      - 'AK_ExusiaiCode/Relics/**'
      - 'references/official/asset/立绘_新约能天使_1.png'
      - 'tools/card_art_manager/card_art_preview.gd'
      - '.github/workflows/stat-*.yml'
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
jobs:
  publish:
    uses: ./.github/workflows/stat-release.yml
    with:
      bootstrap: ${{ inputs.bootstrap || false }}
